@if (open()) {
  <div class="reason-backdrop">
    <section class="reason-dialog" role="dialog" aria-modal="true" aria-labelledby="reason-dialog-eyebrow">
      <span id="reason-dialog-eyebrow" class="reason-eyebrow">
        <span class="reason-mark" aria-hidden="true"></span>
        {{ 'tourUi.reason.eyebrow' | transloco }}
      </span>
      <p class="reason-lead">
        {{ 'tourUi.reason.lead' | transloco }}
      </p>
      <app-reflection-prompt />
      <p class="reason-note">{{ 'tourUi.reason.note' | transloco }}</p>
    </section>
  </div>
}
