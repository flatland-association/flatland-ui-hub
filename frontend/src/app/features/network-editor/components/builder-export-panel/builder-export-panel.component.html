<section class="panel">
  <div class="panel-title">
    <span>{{ 'networkEditor.export' | transloco }}</span>
    <select [value]="exportFormat()" (change)="exportFormat.set($any($event.target).value)">
      <option value="json">{{ 'networkEditor.json' | transloco }}</option>
      <option value="mermaid">{{ 'networkEditor.mermaid' | transloco }}</option>
    </select>
  </div>
  <textarea readonly [value]="exportText()"></textarea>
</section>
