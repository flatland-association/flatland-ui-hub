# Prepares the GitHub Copilot coding agent's sandbox before it starts working,
# so it can run the same checks as CI (AGENTS.md → Commands). GitHub only picks
# this up when the job is named exactly `copilot-setup-steps`. Runs on its own
# via workflow_dispatch / changes to this file, to validate it.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        env:
          SETUP_NO_VENV: '1'
        run: scripts/setup-dev.sh
