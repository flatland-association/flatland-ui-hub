# Mirrors a branch to a Hugging Face Space, so the playground can be refreshed
# from a browser alone (Claude Code on the web, a Codespace, the GitHub web
# editor, a phone) without a terminal and a local HF token.
#
# Two uses:
#   - Upstream (flatland-association/flatland-ui-hub): explore_db → the team's
#     playground Space, as before.
#   - Forks: every push, on any branch, → the fork owner's own Space. A preview
#     for contributors without a local install. It runs only when the fork sets
#     the HF_SPACE variable, so forks that don't want it see a skipped job.
#     Guide: docs/start-contributing.md → "Without a local install".
#
# One-time setup (upstream or fork):
#   1. Create the Space on huggingface.co (SDK: Docker, template: Blank).
#   2. Repo → Settings → Secrets and variables → Actions:
#        secret   HF_TOKEN  = a Hugging Face *write* token
#        variable HF_SPACE  = <user>/<space-name>   (required in a fork;
#                                                    upstream defaults below)
#   3. In a fork only: Actions tab → enable workflows (GitHub disables them
#      in new forks).
#
# The Space gets a single flattened commit — Spaces need no history, and this
# keeps the binaries the image never copies (docs/media, backend/models) out
# of it. Details: docs/deploy-hugging-face-space.md
name: Deploy to Hugging Face Space

on:
  push:
    # Any branch: upstream filters to explore_db in the job condition, forks
    # deploy whatever they push. Kept as '**' rather than two workflows so the
    # assembly below stays the single copy.
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: hf-space-deploy
  cancel-in-progress: true

jobs:
  mirror:
    # Upstream: explore_db is a shared branch — only its Space owner's pushes,
    # or a deliberate manual run, deploy. Forks: any push once HF_SPACE is set.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.repository == 'flatland-association/flatland-ui-hub' &&
       github.ref_name == 'explore_db' && github.actor == 'danib8005') ||
      (github.repository != 'flatland-association/flatland-ui-hub' && vars.HF_SPACE != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check the token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IS_FORK: ${{ github.repository != 'flatland-association/flatland-ui-hub' }}
          HF_SPACE_VAR: ${{ vars.HF_SPACE }}
        run: |
          set -eu
          # A fork must name its own Space; never fall back to the team's.
          if [ "$IS_FORK" = "true" ] && [ -z "$HF_SPACE_VAR" ]; then
            echo "::error::Set the HF_SPACE variable (<user>/<space-name>) in this fork — see the header of this workflow."
            exit 1
          fi
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret is not set — see the header of this workflow."
            exit 1
          fi
          # Fail here with a readable reason rather than on a rejected push.
          if ! who=$(curl -sf -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2); then
            echo "::error::Hugging Face rejected the token. Is it valid, and not expired or revoked?"
            exit 1
          fi
          echo "$who" | jq -r '"identity: \(.name)   token type: \(.auth.type)   role: \(.auth.accessToken.role // "fine-grained")"'
          if [ "$(echo "$who" | jq -r '.auth.accessToken.role // "fine-grained"')" = "read" ]; then
            echo "::error::That is a read token. The Space needs a write token."
            exit 1
          fi

      - name: Assemble the Space tree
        run: |
          set -eu
          # The image copies backend/app and the Angular build only, so none of
          # this ever reaches the container — it would just bloat the Space repo.
          # Stamp the build so the running Space can say which commit it is.
          # This must happen here: the image copies frontend/ and backend/app
          # only, so `.git` never reaches the Docker build and nothing inside it
          # can work out its own version. The frontend serves public/ at the
          # web root, and BuildInfoService reads /build-info.json.
          printf '{\n  "commit": "%s",\n  "branch": "%s",\n  "builtAt": "%s"\n}\n' \
            "${GITHUB_SHA:0:7}" "${GITHUB_REF_NAME}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > frontend/public/build-info.json
          echo "stamped: $(cat frontend/public/build-info.json)"
          rm -rf docs/media backend/models .pytest_cache.zip .github
          cp deploy/hf/Dockerfile Dockerfile
          # The header names explore_db; a fork's Space shows the branch it runs.
          sed "s|(explore_db)|(${GITHUB_REF_NAME})|" deploy/hf/README-header.md | cat - README.md > README.hf
          # Drop the demo links whose media files we just removed.
          grep -v 'docs/media/' README.hf > README.md
          rm -f README.hf
          rm -rf deploy

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE || 'danib8005/flatland-dispatcher-explore-db' }}
        run: |
          set -eu
          rm -rf .git
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Flatland Dispatcher — ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}"
          # HF authenticates by token; the user part of the URL just has to be
          # the Space's owner for fine-grained tokens to match.
          if ! git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main; then
            echo "::error::Push rejected. The token needs *write* access to ${HF_SPACE}. A fine-grained token must list that Space explicitly under Repositories; a classic token must be of type Write."
            exit 1
          fi
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE}"
