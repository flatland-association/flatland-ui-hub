# Build/test gate for main and for external PRs — until now the only
# workflow in this repo was the Hugging Face Space mirror, so a broken
# build or a failing test could reach main unnoticed (see
# docs/plans/stable-release-flatland-start.md, blocker #2).
#
# Frontend and backend are independent jobs: either can fail without
# blocking the other's result from showing up in the PR checks.
#
# Deliberately out of scope for now: `ruff check` on the backend (1628
# pre-existing findings — a real cleanup, not a five-minute gate) and
# `ng test` (Karma needs a real/headless Chrome; the frontend job below
# only builds). Both are candidates for a later, separate workflow change.
#
# The frontend job also runs the two convention gates that every contributor —
# human or AI tool (Codex, Copilot, Goose, Claude, …) — must pass: no new
# hardcoded colours (stylelint) and no translation key used in code that is
# missing from en.json. The instruction files (AGENTS.md, CONTRIBUTING.md) only
# ask; these steps enforce, whichever tool wrote the code.
#
# Backend tests come in tiers (docs/plans/backend-test-tiers.md): every push
# and PR runs unit + integration (`pytest`). The slow and full-scale training
# tests run nightly on explore_db and main, as the line of defence after a
# merge, or when started by hand (Actions → CI → Run workflow → backend_tests).
# The nightly result is the badge in README.md.
name: CI

on:
  push:
    branches: [main, explore_db]
  pull_request:
    # explore_db is the integration branch contributors open PRs against
    # (CONTRIBUTING.md); main is merged from it by the maintainers.
    branches: [main, explore_db]
  workflow_dispatch:
    inputs:
      backend_tests:
        description: 'Backend tests: commit = unit + integration, slow = also the slow tier, full = also full-scale training'
        type: choice
        options: [commit, slow, full]
        default: commit
  schedule:
    # Nightly. GitHub runs schedules on the default branch only, so the
    # backend jobs check out explore_db and main explicitly (matrix below).
    - cron: '0 2 * * *'

jobs:
  frontend:
    # The nightly run is about the backend's slow tiers.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Angular CLI 22 needs >=22.22.3 (see Dockerfile) — the README's
          # "Node.js 20+" undersells this; using the real minimum here so a
          # regression in that requirement shows up as a CI failure, not a
          # surprise for whoever reads the README next.
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: No hardcoded colours (stylelint)
        working-directory: frontend
        run: npm run lint:styles

      - name: Translation keys (i18n check)
        working-directory: frontend
        run: npm run i18n:check

      - name: Build
        working-directory: frontend
        run: npx ng build --configuration production

  backend:
    # On push and PR the matrix holds one empty ref, i.e. the event's own
    # commit, and the job keeps its plain name `backend` for branch protection.
    name: ${{ matrix.ref && format('backend ({0})', matrix.ref) || 'backend' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["explore_db", "main"]' || '[""]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        # requirements-dev.txt pulls in requirements.txt (flatland-rl, fastapi,
        # ...) plus pytest and torch — torch is what makes the Director's
        # `search` plan source and the goal_based_policies tests collectable.
        # The CPU wheel index keeps torch from pulling in the CUDA build,
        # which CI has no use for.
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Test (unit + integration)
        working-directory: backend
        run: pytest -q

  backend-slow:
    name: ${{ matrix.ref && format('backend-slow ({0})', matrix.ref) || 'backend-slow' }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.backend_tests != 'commit')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(github.event_name == 'schedule' && '["explore_db", "main"]' || '[""]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Test (slow, and training when full)
        working-directory: backend
        # -n 2: several of these tests start their own process pools.
        env:
          RUN_TRAINING: ${{ (github.event_name == 'schedule' || inputs.backend_tests == 'full') && '--run-training' || '' }}
        run: pytest -q -n 2 --run-slow $RUN_TRAINING -m "slow or training"
