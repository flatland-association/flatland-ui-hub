[pytest]
testpaths = tests
asyncio_mode = auto
# Parallel by default (pytest-xdist). loadfile keeps a module on one worker, so
# module-scoped fixtures and the module-level TestClient are built once. At
# most 4 workers: each imports torch, Flatland and the app (~1.3 GB), and on a
# 16 GB machine 8 workers ran slower than 4. Pass -n 0 to run serially, e.g.
# under a debugger.
addopts = -n auto --maxprocesses 4 --dist loadfile
# Test tiers (docs/plans/backend-test-tiers.md). An unmarked test is a unit
# test: pure logic, under 0.5 s. `pytest` runs unit + integration, the tier for
# every commit; slow and training tests are skipped unless asked for.
markers =
    integration: FastAPI app, session, env episode or planner; under 10 s per test. Runs on every commit.
    slow: 10 s or more per test, or a cut-down training run. Skipped unless --run-slow (nightly, or CI started by hand).
    training: full-scale model training. Skipped unless --run-training (nightly only).
